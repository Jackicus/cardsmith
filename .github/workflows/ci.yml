name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fontconfig
          fc-list | grep -i "Noto Sans CJK JP" | head -n 3

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Build a sample plate
        if: matrix.python-version == '3.13'
        run: cardsmith build examples/japanese/jlpt-n5-kanji.tsv -t kanji --limit 7 -o sample-plate

      - name: Upload sample plate
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: sample-kanji-plate
          path: sample-plate
